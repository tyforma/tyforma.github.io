<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TY Forma</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                   "Hiragino Sans", sans-serif;
      color: #1d1d1f;
      background: #ffffff;
    }

    header {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 32px;
      font-size: 20px;
      font-weight: 600;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 100px 32px 80px;
    }

    h1 {
      margin: 0;
      font-size: 56px;
      line-height: 1.1;
      letter-spacing: -1.5px;
    }

    .lead {
      margin-top: 20px;
      font-size: 24px;
      line-height: 1.5;
      color: #6e6e73;
    }

    section {
      margin-top: 100px;
      padding-top: 40px;
      border-top: 1px solid #d2d2d7;
    }

    h2 {
      font-size: 30px;
      margin: 0 0 20px;
    }

    h3 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    h3 a {
      color: inherit;
      text-decoration: none;
    }
    
    h3 a:hover {
      text-decoration: underline;
    }
    
    p {
      font-size: 17px;
      line-height: 1.7;
    }

    a {
      color: #0066cc;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      max-width: 980px;
      margin: 0 auto;
      padding: 30px 32px 50px;
      border-top: 1px solid #d2d2d7;
      color: #6e6e73;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      main {
        padding-top: 60px;
      }

      h1 {
        font-size: 42px;
      }

      .lead {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    TY Forma
  </header>

  <main>

    <h1>TY Forma</h1>
    <p class="lead">
      情報やアイデアを、使いやすい形に。
    </p>

    <section>
      <h2>アプリ</h2>

      <h3>
        <a href="/cdlibraryviewer/">CDLibraryViewer</a>
      </h3>
      <p>
        CDライブラリを整理・閲覧し、音楽を楽しむための
        macOSアプリケーションです。
      </p>
    </section>

    <section>
      <h2>サポート</h2>
      <p>
        ご質問・お問い合わせは
        <a href="mailto:tyforma.support@gmail.com">
          tyforma.support@gmail.com
        </a>
        までご連絡ください。
      </p>
    </section>

    <section>
      <h2>プライバシー</h2>
      <p>
        各アプリのプライバシーポリシーを掲載します。
      </p>
    </section>

  </main>

  <footer>
    © 2026 TY Forma
  </footer>

</body>
</html>
